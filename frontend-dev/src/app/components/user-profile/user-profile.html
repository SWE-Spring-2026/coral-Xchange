<div class="page">
    @if (auth.currentUser(); as user) {
    <mat-card class="profile-header" appearance="outlined">
        <mat-card-header>
        <div mat-card-avatar class="profile-avatar">
            <mat-icon>account_circle</mat-icon>
        </div>

        <mat-card-title>{{ user.name }}</mat-card-title>
        <mat-card-subtitle>@{{ user.username }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
        <p>Email: {{ user.email }}</p>
        <p>Member since: {{ user.memberSince }}</p>
        <p>Cash Balance: ${{ user.balance }}</p>
        </mat-card-content>

        <mat-card-actions>
        <button mat-button disabled>Edit Profile</button>
        <button mat-button (click)="logout()">Logout</button>
        </mat-card-actions>
    </mat-card>
    } @else {
    <mat-card appearance="outlined">
        <mat-card-header>
        <mat-card-title>You are not logged in</mat-card-title>
        </mat-card-header>

        <mat-card-content>
        <p>Please log in to view your profile.</p>
        </mat-card-content>

        <mat-card-actions>
        <a mat-button routerLink="/login">Go to Log In</a>
        </mat-card-actions>
    </mat-card>
    }
</div>
