@if (holdings().totalValue != -1) {

  @if(show_grid)
  {
    <div class="portfolio-layout">
      <div class="ag-grid-wrapper">
        <ag-grid-angular 
          class="grid"
          [rowData]="row_data"
          [columnDefs]="col_defs">
        </ag-grid-angular>
      </div>

      <div class="chart-wrapper">
        <portfolio-chart></portfolio-chart>
      </div>
    </div>
  }

} @else {
  <p>Loading portfolio...</p>
}
